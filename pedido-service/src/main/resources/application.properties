spring.application.name=pedido-service
server.port=8083
spring.datasource.url=jdbc:h2:file:./data/pedido
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.deserialization.accept-float-as-int=false
produto.base-url=${PRODUTO_BASE_URL:http://localhost:8081}
produto.timeout-conexao=${PRODUTO_TIMEOUT_CONEXAO:2s}
produto.timeout-leitura=${PRODUTO_TIMEOUT_LEITURA:3s}
